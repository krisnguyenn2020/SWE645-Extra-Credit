<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Surveys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2 class="mb-4">All Submitted Surveys</h2>
    <table class="table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for survey in surveys %}
          <tr>
            <td>{{ survey.first_name }} {{ survey.last_name }}</td>
            <td>{{ survey.email }}</td>
            <td>
              <a href="{% url 'update_survey' survey.id %}" class="btn btn-warning btn-sm">Edit</a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      
    <a href="{% url 'submit_form' %}" class="btn btn-secondary">Back to Form</a>
</body>
</html>
