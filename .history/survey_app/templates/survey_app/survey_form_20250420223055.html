<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Survey</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    {% if messages %}
        {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% endif %}

    <h2 class="mb-4">Submit Student Survey</h2>
    <form method="POST" action="{% url 'submit_form' %}">
        {% csrf_token %}
        <div class="mb-3">
            <label>First Name</label>
            <input name="first_name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Last Name</label>
            <input name="last_name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input name="email" type="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Street Address</label>
            <input name="street_address" class="form-control">
        </div>
        <div class="mb-3">
            <label>City</label>
            <input name="city" class="form-control">
        </div>
        <div class="mb-3">
            <label>State</label>
            <input name="state" class="form-control">
        </div>
        <div class="mb-3">
            <label>Zip</label>
            <input name="zip" class="form-control">
        </div>
        <div class="mb-3">
            <label>Telephone</label>
            <input name="telephone_number" class="form-control">
        </div>
        <div class="mb-3">
            <label>Liked Most</label>
            <input name="liked_most" class="form-control">
        </div>
        <div class="mb-3">
            <label>Interest Source</label>
            <input name="interest_source" class="form-control">
        </div>
        <div class="mb-3">
            <label>Recommendation</label>
            <input name="recommendation" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
        <a href="{% url 'survey_list' %}" class="btn btn-link">View All</a>
    </form>
</body>
</html>
