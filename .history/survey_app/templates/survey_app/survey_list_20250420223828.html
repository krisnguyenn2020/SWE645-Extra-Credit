<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Surveys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2 class="mb-4">All Submitted Surveys</h2>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>City</th>
                <th>Date</th>
                <th>Actions</th> <!-- Add this column -->
            </tr>
        </thead>
        <tbody>
            {% for s in surveys %}
            <tr>
                <td>{{ s.id }}</td>
                <td>{{ s.first_name }} {{ s.last_name }}</td>
                <td>{{ s.email }}</td>
                <td>{{ s.city }}</td>
                <td>{{ s.date_of_survey }}</td>
                <td>
                    <a href="{% url 'update_survey' s.id %}" class="btn btn-warning btn-sm">Edit</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    
    <a href="{% url 'submit_form' %}" class="btn btn-secondary">Back to Form</a>
</body>
</html>
